# stunnel configuration for Nintendo DS SSL termination
#
# The DS uses SSLv3 with RC4-SHA or RC4-MD5 — both deprecated.
# This configuration accepts those connections and forwards decrypted
# HTTP to the event-server container on port 8080.
#
# nds-constrain't exploit:
#   The DS validates server certificates against Nintendo's CA, but doesn't
#   check the basicConstraints extension. This lets us use the Wii client
#   certificate (which is signed by Nintendo's CA) as an intermediate CA
#   to sign our own server certificate. The DS trusts it.
#   Certificate chain: Nintendo Root CA → Wii NWC cert → our server cert

foreground = yes
debug      = 4

# TIMEOUTclose=0: the DS never sends an SSL close_notify alert.
# Without this, stunnel would wait indefinitely for a clean shutdown.
TIMEOUTclose = 0

[nintendo-https]
accept  = 443
connect = event-server:8080

# Certificate chain must include our server cert + the Wii NWC intermediate cert
cert = /etc/stunnel/certs/server-chain.crt
key  = /etc/stunnel/certs/server.key

# SSLv3 with RC4 — the only ciphers the DS supports
sslVersion    = SSLv3
ciphers       = RC4-SHA:RC4-MD5:@SECLEVEL=0

# DONT_INSERT_EMPTY_FRAGMENTS: disable the SSLv3 empty fragment countermeasure
# which the DS's SSL implementation doesn't handle correctly
options       = DONT_INSERT_EMPTY_FRAGMENTS
securityLevel = 0